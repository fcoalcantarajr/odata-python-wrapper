repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.8
          - types-python-dateutil>=2.9
        args: ["--strict"]
        files: ^src/

  - repo: local
    hooks:
      - id: audit-forbidden-tokens
        name: audit forbidden tokens (HR FORBIDDEN list)
        entry: bash scripts/audit.sh
        language: system
        pass_filenames: false
        always_run: true
