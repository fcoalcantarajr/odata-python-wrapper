[project]
name = "ado-odata-async"
version = "0.1.0"
description = "Async Python wrapper for Azure DevOps Analytics OData (v4.0-preview)."
readme = "README.md"
requires-python = ">=3.12"
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Chicão Alcântara", email = "fcoalcantarajr@gmail.com" }]
keywords = ["azure-devops", "analytics", "odata", "async", "aiohttp"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Framework :: AsyncIO",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "aiohttp>=3.13,<4",
  "pydantic>=2.8,<3",
  "tenacity>=9,<10",
  "yarl>=1.15,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<0.25",
  "aioresponses>=0.7,<0.8",
  "hypothesis>=6.112,<7",
  "pytest-cov>=5,<6",
  "ruff>=0.8,<1",
  "mypy>=1.11,<2",
  "pre-commit>=4.0,<5",
  "types-python-dateutil>=2.9,<3",
]

[project.urls]
Homepage = "https://github.com/fcoalcantarajr/ado-odata-async"
Repository = "https://github.com/fcoalcantarajr/ado-odata-async"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ado_odata_async"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W", "I",      # pycodestyle, pyflakes, isort
  "B",                       # bugbear
  "UP",                      # pyupgrade
  "ASYNC",                   # async checks
  "S",                       # bandit
  "N",                       # pep8-naming
  "SIM",                     # simplify
  "PT",                      # pytest
  "RUF",
]
ignore = ["S101"]            # assert OK em testes

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "D"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_unimported = true
show_error_codes = true
files = ["src/ado_odata_async"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
markers = [
    "integration: marca testes que batem em serviço real (skip por default)",
    "asyncio: mark async test functions for pytest-asyncio",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["ado_odata_async"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]

[dependency-groups]
dev = [
    "aioresponses>=0.7.8",
    "hypothesis>=6.152.9",
    "pre-commit>=4.0,<5",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=5.0.0",
    "ruff>=0.8",
]
